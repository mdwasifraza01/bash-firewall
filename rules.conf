# rules.conf - firewall rules for fw.sh
#
# Format (one rule per line, '#' starts a comment):
#
#   <allow|deny> <tcp|udp> <port|start:end> [source-ip[/cidr]]
#   <allow|deny> icmp [source-ip[/cidr]]
#
# Everything not explicitly allowed is dropped (default policy: DROP).
# 'deny' rules are logged, then dropped.
# Rules are checked top to bottom - the first match wins.

# --- Remote administration ---
allow tcp 22                 # SSH (rate limited by fw.sh against brute force)

# --- Web server ---
allow tcp 80                 # HTTP
allow tcp 443                # HTTPS

# --- Diagnostics ---
allow icmp                   # ping

# --- Examples (uncomment to try) ---
# allow tcp 22 192.168.1.0/24   # SSH only from the local network
# allow tcp 8000:8100           # a range of ports
# allow udp 53                  # DNS server
# deny  tcp 23                  # explicitly block telnet (and log attempts)
